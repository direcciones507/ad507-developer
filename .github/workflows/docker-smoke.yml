name: AS Developer | Isolated Docker smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-smoke:
    name: Real Docker boundary check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build reviewed sandbox image
        run: docker build -f deploy/checks-ci.Dockerfile -t ad507-checks:ci .
      - name: Run real isolated checks without provider secrets
        run: npm run test:sandbox
